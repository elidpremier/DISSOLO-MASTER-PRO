<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#080c17"/>
  <!-- Gradient defs -->
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- Flask body -->
  <path d="M180 160 L180 280 L100 400 Q92 416 108 424 L404 424 Q420 416 412 400 L332 280 L332 160 Z"
        fill="none" stroke="url(#g1)" stroke-width="18" stroke-linejoin="round"/>
  <!-- Flask neck top -->
  <rect x="195" y="100" width="122" height="65" rx="12"
        fill="none" stroke="url(#g1)" stroke-width="18"/>
  <!-- Liquid inside -->
  <path d="M148 370 L120 400 Q112 414 128 422 L384 422 Q400 414 392 400 L364 370 Z"
        fill="url(#g2)" opacity="0.85"/>
  <!-- Bubbles -->
  <circle cx="210" cy="350" r="12" fill="#60a5fa" opacity="0.6"/>
  <circle cx="260" cy="320" r="8"  fill="#a78bfa" opacity="0.5"/>
  <circle cx="310" cy="355" r="10" fill="#60a5fa" opacity="0.5"/>
  <!-- Timer arc (top right of flask) -->
  <circle cx="380" cy="148" r="56" fill="#0f1623" stroke="url(#g1)" stroke-width="10"/>
  <path d="M380 100 A48 48 0 0 1 428 148" stroke="#34d399" stroke-width="8"
        fill="none" stroke-linecap="round"/>
  <line x1="380" y1="148" x2="380" y2="110" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <line x1="380" y1="148" x2="408" y2="162" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
</svg>
